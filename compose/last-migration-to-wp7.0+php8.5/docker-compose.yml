services:
  db:
    image: mysql:5.7
    container_name: wp_mysql_57
    restart: always
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: secure_root_password
    volumes:
      # Automatically imports your original database dump if the volume is new
      - ../../db-dump:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    # Healthcheck tells Docker how to test if MySQL is genuinely ready, not just running
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wp_user", "-pwp_password"]
      timeout: 5s
      retries: 5
      interval: 5s      
    ports:
      - "3306:3306"

  web:
    image: wordpress:7.0-php8.5-apache
    container_name: wp_production_70
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
    volumes:
      # Mounts your local WordPress source code directory directly into the container
      - ./html:/var/www/html
      - ../../wordpress-files:/var/www/html
    ports:
      - "80:80"

volumes:
  db_data: