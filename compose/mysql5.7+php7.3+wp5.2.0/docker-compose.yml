#version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: wp_old_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password

    volumes:
      - ../../db-dump:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    # Healthcheck tells Docker how to test if MySQL is genuinely ready, not just running
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wp_user", "-pwp_password"]
      timeout: 5s
      retries: 5
      interval: 5s

  wordpress:
    image: wordpress:5.2.0-php7.3-apache
    #image: webdevops/php-apache:ubuntu-14.04
    container_name: wp_old_site
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress_db

    volumes:
      - ../../wordpress-files:/var/www/html

    # This prevents WordPress from starting until the DB healthcheck passes
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: